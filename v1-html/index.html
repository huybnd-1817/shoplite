<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopLite – Cửa hàng trực tuyến</title>
  <link rel="stylesheet" href="style.css" />
  <script>tailwind.config = { corePlugins: { preflight: false } }</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Áp dụng theme ngay trước khi render để tránh flash -->
  <script>(function () { var s = localStorage.getItem('shoplite-theme'); if (s) document.documentElement.setAttribute('data-theme', s); })();</script>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo" aria-label="ShopLite – trang chủ">ShopLite</a>

      <form class="search-form" role="search">
        <label for="search-input" class="sr-only">Tìm kiếm sản phẩm</label>
        <input type="search" id="search-input" name="q" placeholder="Tìm kiếm sản phẩm…" autocomplete="off" />
        <button type="submit" aria-label="Tìm kiếm">
          <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </form>

      <button type="button" class="btn-login" aria-label="Đăng nhập">
        <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <span class="btn-login-label">Đăng nhập</span>
      </button>
      <button type="button" class="btn-theme" id="btn-theme" aria-label="Chuyển giao diện tối/sáng">
        <svg class="icon-sun" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5" />
          <path
            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
        <svg class="icon-moon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
      <a href="cart.html" class="cart-link" aria-label="Giỏ hàng – 3 sản phẩm">
        <svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
        <span class="cart-badge" aria-hidden="true">3</span>
      </a>
    </div>
  </header>

  <main>
    <section class="product-section">
      <h1>Sản phẩm</h1>

      <div class="product-grid">
        <article id="featured-card" class="product-card" data-category="electronics">
          <a href="product.html" class="card-link" aria-label="Xem chi tiết Tai nghe không dây Pro"></a>
          <div class="card-image-wrap">
            <img src="https://placehold.co/300x220/e8f0fe/4a6cf7?text=Sản+phẩm+1" alt="Tai nghe không dây" />
          </div>
          <h2 class="product-title">Tai nghe không dây Pro</h2>
          <p class="product-price">799.000đ</p>
          <button type="button" class="btn-add-cart">Thêm vào giỏ</button>
        </article>

        <article class="product-card" data-category="clothing">
          <a href="product.html" class="card-link" aria-label="Xem chi tiết Áo thun basic unisex"></a>
          <div class="card-image-wrap">
            <img src="https://placehold.co/300x220/fce8e8/cf4444?text=Sản+phẩm+2" alt="Áo thun basic" />
          </div>
          <h2 class="product-title">Áo thun basic unisex</h2>
          <p class="product-price">199.000đ</p>
          <button type="button" class="btn-add-cart">Thêm vào giỏ</button>
        </article>

        <article class="product-card" data-category="home">
          <a href="product.html" class="card-link" aria-label="Xem chi tiết Đèn bàn LED cảm ứng"></a>
          <div class="card-image-wrap">
            <img src="https://placehold.co/300x220/e8fce8/44cf55?text=Sản+phẩm+3" alt="Đèn bàn LED" />
          </div>
          <h2 class="product-title">Đèn bàn LED cảm ứng</h2>
          <p class="product-price">349.000đ</p>
          <button type="button" class="btn-add-cart">Thêm vào giỏ</button>
        </article>

        <article class="product-card" data-category="electronics">
          <a href="product.html" class="card-link" aria-label="Xem chi tiết Sạc dự phòng 20000mAh"></a>
          <div class="card-image-wrap">
            <img src="https://placehold.co/300x220/fef8e8/cf9a44?text=Sản+phẩm+4" alt="Sạc dự phòng" />
          </div>
          <h2 class="product-title">Sạc dự phòng 20000mAh</h2>
          <p class="product-price">459.000đ</p>
          <button type="button" class="btn-add-cart">Thêm vào giỏ</button>
        </article>

        <article
          class="group bg-[var(--color-surface)] rounded-[var(--radius)] overflow-hidden flex flex-col relative transition-[transform,box-shadow] duration-200 odd:bg-[var(--color-surface-alt)] hover:-translate-y-1 hover:shadow-[var(--shadow-hover)] border border-transparent hover:border-[var(--color-primary)]"
          data-category="electronics">
          <a href="product.html" class="absolute inset-0 z-10" aria-label="Xem chi tiết Sạc dự phòng 20000mAh"></a>
          <div class="card-image-wrap overflow-hidden aspect-[4/3] bg-[var(--color-bg)]">
            <img class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
              src="https://placehold.co/300x220/fef8e8/cf9a44?text=Sản+phẩm+5" alt="Sạc dự phòng" />
          </div>
          <h2 class="text-base font-semibold pt-3.5 px-4 pb-1 leading-[1.4]">Sạc dự phòng 20000mAh</h2>
          <p class="text-[0.95rem] font-bold text-[var(--color-primary)] px-4">459.000đ</p>
          <button type="button"
            class="mt-auto mx-4 mb-4 relative z-[2] py-[9px] bg-[var(--color-primary)] text-white text-sm font-semibold rounded-md text-center transition-opacity duration-200 hover:opacity-[.85]">Thêm
            vào giỏ</button>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-brand">ShopLite &copy; 2026</p>
      <p class="footer-tagline">Mua sắm dễ dàng – giao hàng nhanh chóng</p>
      <nav aria-label="Footer">
        <ul class="footer-links">
          <li><a href="/about">Giới thiệu</a></li>
          <li><a href="/contact">Liên hệ</a></li>
          <li><a href="/policy">Chính sách</a></li>
          <li><a href="/faq">FAQ</a></li>
        </ul>
      </nav>
    </div>
  </footer>
  <script>
    document.getElementById('btn-theme').addEventListener('click', function () {
      var html = document.documentElement;
      var isDark = html.getAttribute('data-theme') === 'dark' ||
        (!html.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var next = isDark ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('shoplite-theme', next);
    });
  </script>
</body>

</html>
